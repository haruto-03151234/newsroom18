name: Collect news and publish Pages

on:
  schedule:
    - cron: "0 6 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 12 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 18 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:
    inputs:
      edition:
        description: "再生成するニュース版"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - "06"
          - "12"
          - "18"
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/news-pages.yml"

permissions: {}

concurrency:
  group: news-pages
  cancel-in-progress: false

env:
  LOCAL_MODEL_CACHE_DIR: ${{ github.workspace }}/.cache/newsroom18-model
  LOCAL_MODEL_FILE: ${{ github.workspace }}/.cache/newsroom18-model/Qwen3-4B-Q4_K_M.gguf
  LOCAL_MODEL_SHA256: 7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5
  LLAMA_CPP_VERSION: b10437

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install collector dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Restore Qwen model cache
        if: github.event_name != 'push'
        uses: actions/cache@v5
        with:
          path: ${{ env.LOCAL_MODEL_CACHE_DIR }}
          key: qwen3-4b-q4-k-m-${{ env.LOCAL_MODEL_SHA256 }}

      - name: Verify or download Qwen model
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          MODEL_URL: https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/main/Qwen3-4B-Q4_K_M.gguf?download=true
        run: |
          set -euo pipefail
          mkdir -p "$LOCAL_MODEL_CACHE_DIR"
          temporary_model="${LOCAL_MODEL_FILE}.download"
          trap 'rm -f "$temporary_model"' EXIT

          if ! printf '%s  %s\n' "$LOCAL_MODEL_SHA256" "$LOCAL_MODEL_FILE" | sha256sum --check --strict; then
            curl --fail --location --retry 5 --retry-delay 5 \
              --output "$temporary_model" "$MODEL_URL"
            printf '%s  %s\n' "$LOCAL_MODEL_SHA256" "$temporary_model" | sha256sum --check --strict
            mv "$temporary_model" "$LOCAL_MODEL_FILE"
          fi

          printf '%s  %s\n' "$LOCAL_MODEL_SHA256" "$LOCAL_MODEL_FILE" | sha256sum --check --strict
          echo "LOCAL_MODEL_PATH=$LOCAL_MODEL_FILE" >> "$GITHUB_ENV"

      - name: Install pinned llama.cpp runtime
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/llama-${LLAMA_CPP_VERSION}-bin-ubuntu-x64.tar.gz"
          install_dir="$RUNNER_TEMP/llama.cpp-${LLAMA_CPP_VERSION}"
          release_url="https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_CPP_VERSION}/llama-${LLAMA_CPP_VERSION}-bin-ubuntu-x64.tar.gz"

          mkdir -p "$install_dir"
          curl --fail --location --retry 5 --retry-delay 5 \
            --output "$archive" "$release_url"
          tar -xzf "$archive" -C "$install_dir"

          llama_cli="$(find "$install_dir" -type f -name llama-cli -print -quit)"
          if [ -z "$llama_cli" ]; then
            echo "llama-cli was not found in the pinned release archive." >&2
            exit 1
          fi

          chmod +x "$llama_cli"
          library_dir="$(dirname "$llama_cli")"
          runtime_library_path="${library_dir}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          export LD_LIBRARY_PATH="$runtime_library_path"
          "$llama_cli" --version

          echo "LLAMA_CLI_PATH=$llama_cli" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$runtime_library_path" >> "$GITHUB_ENV"

      - name: Select logical edition
        if: github.event_name != 'push'
        id: edition
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_EDITION: ${{ inputs.edition || 'auto' }}
        run: |
          edition="$REQUESTED_EDITION"
          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$SCHEDULE" in
              "0 6 * * *") edition="06" ;;
              "0 12 * * *") edition="12" ;;
              "0 18 * * *") edition="18" ;;
              *) edition="auto" ;;
            esac
          fi
          echo "edition=$edition" >> "$GITHUB_OUTPUT"

      - name: Collect and edit news
        if: github.event_name != 'push'
        env:
          EVENT_NAME: ${{ github.event_name }}
          EDITION: ${{ steps.edition.outputs.edition }}
        run: |
          arguments=(--edition "$EDITION")
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            arguments+=(--force)
          fi
          python scripts/collect_news.py "${arguments[@]}"

      - name: Save generated edition
        if: github.event_name != 'push'
        env:
          EDITION: ${{ steps.edition.outputs.edition }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .state/news-state.json site/data site/feed.xml site/sitemap.xml content
          if git diff --cached --quiet; then
            echo "No generated changes to save."
          else
            git commit -m "news: publish ${EDITION} edition [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
