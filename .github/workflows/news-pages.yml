name: Collect news and publish Pages

on:
  schedule:
    - cron: "0 6 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 12 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 18 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:
    inputs:
      edition:
        description: "再生成するニュース版"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - "06"
          - "12"
          - "18"
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/news-pages.yml"

permissions: {}

concurrency:
  group: news-pages-production-v1
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install collector dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Select logical edition
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[collect]')
        id: edition
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_EDITION: ${{ inputs.edition || 'auto' }}
        run: |
          edition="$REQUESTED_EDITION"
          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$SCHEDULE" in
              "0 6 * * *") edition="06" ;;
              "0 12 * * *") edition="12" ;;
              "0 18 * * *") edition="18" ;;
              *) edition="auto" ;;
            esac
          fi
          echo "edition=$edition" >> "$GITHUB_OUTPUT"

      - name: Collect and edit news
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[collect]')
        env:
          EVENT_NAME: ${{ github.event_name }}
          EDITION: ${{ steps.edition.outputs.edition }}
        run: |
          arguments=(--edition "$EDITION")
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "push" ]; then
            arguments+=(--force)
          fi
          python scripts/collect_news.py "${arguments[@]}"

      - name: Save generated edition
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[collect]')
        env:
          EDITION: ${{ steps.edition.outputs.edition }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .state/news-state.json site/data site/feed.xml site/sitemap.xml content
          if git diff --cached --quiet; then
            echo "No generated changes to save."
          else
            git commit -m "news: publish ${EDITION} edition [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
