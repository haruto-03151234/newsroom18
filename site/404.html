<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#132c3d">
    <title>ページが見つかりません | NEWSROOM 18</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23bd2c1a'/%3E%3Ctext x='50' y='69' font-size='62' text-anchor='middle' fill='white' font-family='serif'%3E速%3C/text%3E%3C/svg%3E">
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        display: grid;
        place-items: center;
        color: #161817;
        background: #f4f0e8;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      }
      main {
        width: min(100%, 720px);
        padding: clamp(28px, 7vw, 70px);
        background: #fffdf8;
        border-top: 8px solid #bd2c1a;
        box-shadow: 0 18px 50px rgb(29 27 22 / 12%);
      }
      .kicker { margin: 0; color: #bd2c1a; font-size: .7rem; font-weight: 800; letter-spacing: .18em; }
      h1 { margin: 6px 0 18px; font-family: Georgia, "Yu Mincho", serif; font-size: clamp(2.2rem, 9vw, 5rem); line-height: 1.12; }
      p { color: #50534f; line-height: 1.9; }
      a { margin-top: 16px; padding: 11px 18px; display: inline-block; color: #fff; background: #132c3d; font-weight: 700; text-decoration: none; }
      a:hover { background: #bd2c1a; }
      a:focus-visible { outline: 3px solid #0769d7; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">404 / PAGE NOT FOUND</p>
      <h1>紙面の外に<br>出たようです。</h1>
      <p>お探しのページは移動したか、URLが正しくない可能性があります。最新号からニュースをお選びください。</p>
      <a id="home-link" href="./">最新号へ戻る</a>
    </main>
    <script>
      (() => {
        const parts = window.location.pathname.split("/").filter(Boolean);
        const isProjectPage = window.location.hostname.endsWith("github.io") && parts.length > 0;
        document.getElementById("home-link").href = isProjectPage ? `/${parts[0]}/` : "./";
      })();
    </script>
  </body>
</html>
